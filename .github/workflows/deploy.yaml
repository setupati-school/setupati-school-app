name: Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - releases/release*
      - test-firebase-deployment
  pull_request:

jobs:
  sync-secrets:
    name: 🔐 Decrypt & Sync Secrets (SOPS)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Check for encrypted secrets file
        id: has_secrets
        run: |
          if [ -f "secrets/client/secrets.enc.yaml" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚙️ Setup SOPS
        if: steps.has_secrets.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -L "https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64" -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          curl -L "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: 🔑 Import GPG Private Key
        if: steps.has_secrets.outputs.found == 'true'
        env:
          SOPS_GPG_PRIVATE_KEY: ${{ secrets.SOPS_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${SOPS_GPG_PRIVATE_KEY:-}" ]; then
            echo "❌ Missing SOPS_GPG_PRIVATE_KEY secret!" >&2
            exit 1
          fi
          echo "🔑 Importing GPG private key..."
          echo "$SOPS_GPG_PRIVATE_KEY" > /tmp/private.key
          gpg --batch --import /tmp/private.key
          echo "✅ GPG setup complete"

      - name: 🔓 Decrypt secrets using SOPS
        if: steps.has_secrets.outputs.found == 'true'
        run: |
          mkdir -p secrets/client
          echo "🔓 Decrypting secrets..."
          sops --decrypt secrets/client/secrets.enc.yaml > secrets/client/secrets.dec.yaml
          echo "✅ Secrets decrypted successfully"

      - name: 🧾 Convert YAML → .env
        if: steps.has_secrets.outputs.found == 'true'
        run: |
          echo "🔁 Converting YAML to .env..."
          sudo apt-get update && sudo apt-get install -y yq
          yq eval '. | to_entries | .[] | "\(.key)=\(.value)"' secrets/client/secrets.dec.yaml > secrets/client/secrets.env
          echo "✅ Converted secrets to .env format"

      - name: 📦 Upload decrypted env file for deploy job
        if: steps.has_secrets.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decrypted-env
          path: secrets/client/secrets.env

  deploy:
    needs: [sync-secrets]
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    container:
      image: node:20
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download decrypted env
        uses: actions/download-artifact@v4
        with:
          name: decrypted-env
          path: secrets/client

      - name: 🌱 Load environment variables
        shell: bash
        run: |
         echo "Loading environment variables..."
         while IFS='=' read -r key value; do
         # skip empty lines or comments
         [[ -z "$key" || "$key" =~ ^# ]] && continue
         echo "$key=$value" >> $GITHUB_ENV
         done < secrets/client/secrets.env
         echo "✅ Environment variables loaded globally"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build App
        run: npm run build

      - name: 🧹 Run Linter
        run: npm run lint
      
      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 🔍 Check for app folder changes
        id: changes
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only HEAD origin/main -- app/)
          if [ -n "$CHANGED" ]; then
            echo "deploy=true" >> $GITHUB_ENV
            echo "✅ Changes found in app/: $CHANGED"
          else
            echo "deploy=false" >> $GITHUB_ENV
            echo "ℹ️ No changes in app/"
          fi

      - name: Debug secret length
        run: echo "Length ${#FIREBASE_SERVICE_ACCOUNT_HOSTING}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Decode Firebase service account
        shell: bash
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_HOSTING" | base64 --decode > sa.json

      - name: 🌐 Deploy Preview (Pull Request)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} \
            --project setupati-school-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json

      - name: 🚀 Deploy Live
        shell: bash
        run: |
          firebase deploy --only hosting --project setupati-school-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json


      - name: 🛠️ Deploy Backend to Render
        if: env.deploy == 'true'
        shell: bash
        run: |
          echo "🚀 Deploying backend to Render..."
          URL=$(echo "$RENDER_DEPLOY_HOOK_URL" | tr -d '[:space:]')
          curl "$URL"
