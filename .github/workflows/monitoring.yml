name: Monitoring Validation

on:
  push:
  pull_request:

jobs:
  monitoring-check:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Start Node.js app
      - name: Start app
        run: |
          npm start &
          sleep 10

      # 5️⃣ Download Prometheus
      - name: Download Prometheus
        run: |
          wget https://github.com/prometheus/prometheus/releases/download/v2.49.1/prometheus-2.49.1.linux-amd64.tar.gz
          tar xvf prometheus-2.49.1.linux-amd64.tar.gz

      # 6️⃣ Start Prometheus
      - name: Start Prometheus
        run: |
          ./prometheus-2.49.1.linux-amd64/prometheus \
          --config.file=prometheus.yml &
          sleep 10

      # 7️⃣ Verify metrics endpoint
      - name: Check /metrics endpoint
        run: curl http://localhost:3001/metrics

      # 8️⃣ Verify Prometheus is scraping
      - name: Check Prometheus metrics
        run: |
          curl "http://localhost:9090/api/v1/query?query=process_cpu_seconds_total"
