<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/school.png" />

    <!-- Viewport Configuration for Mobile-First -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta
      name="description"
      content="Setupati School Management System - academic information, attendance, exam results, and school announcements"
    />
    <meta
      name="keywords"
      content="school management, education, attendance, results, timetable"
    />
    <meta name="author" content="Setupati School" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Setupati School" />
    <link rel="apple-touch-icon" href="/school.png" />

    <!-- Microsoft PWA Support -->
    <meta name="msapplication-TileImage" content="/school.png" />
    <meta name="msapplication-TileColor" content="#1e40af" />
    <meta name="msapplication-navbutton-color" content="#1e40af" />

    <!-- Security Headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://translate.googleapis.com; frame-src https://translate.google.com;"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font Loading with Performance Optimization -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Preload Critical Resources -->
    <link rel="preload" href="/school.png" as="image" type="image/png" />

    <!-- Critical CSS for App Shell - Inlined for Performance -->
    <style>
      /* Critical CSS for App Shell - should be inlined in HTML head */

      /* Base styles for immediate rendering */
      * {
        box-sizing: border-box;
      }

      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          'Noto Sans',
          sans-serif;
      }

      body {
        margin: 0;
        background-color: hsl(0 0% 100%);
        color: hsl(220 15% 15%);
        font-feature-settings:
          'rlig' 1,
          'calt' 1;
      }

      /* App shell layout - critical for first paint */
      .app-shell {
        display: flex;
        min-height: 100vh;
        background-color: hsl(0 0% 100%);
      }

      .app-shell-sidebar {
        background-color: hsl(0 0% 100%);
        border-right: 1px solid hsl(215 20% 92%);
        width: 4rem;
        transition: width 300ms ease-in-out;
      }

      @media (min-width: 768px) {
        .app-shell-sidebar {
          width: 16rem;
        }
      }

      .app-shell-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .app-shell-header {
        background-color: hsl(0 0% 100%);
        border-bottom: 1px solid hsl(215 20% 92%);
        padding: 0.75rem 1rem;
      }

      @media (min-width: 640px) {
        .app-shell-header {
          padding: 1rem 1.5rem;
        }
      }

      .app-shell-content {
        flex: 1;
        overflow: auto;
        padding: 0.75rem;
      }

      @media (min-width: 640px) {
        .app-shell-content {
          padding: 1rem;
        }
      }

      @media (min-width: 768px) {
        .app-shell-content {
          padding: 1.5rem;
        }
      }

      /* Touch targets - critical for mobile usability */
      .touch-target {
        min-height: 44px;
        min-width: 44px;
      }

      /* Loading animation - critical for perceived performance */
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Skeleton styles for loading states */
      .skeleton {
        background-color: hsl(215 20% 96%);
        border-radius: 0.375rem;
      }

      /* Mobile menu button positioning */
      @media (max-width: 767px) {
        .mobile-menu-button {
          position: fixed;
          top: 1rem;
          left: 1rem;
          z-index: 50;
          background-color: hsl(0 0% 100%);
          border: 1px solid hsl(215 20% 92%);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          min-height: 44px;
          min-width: 44px;
        }

        .mobile-content-offset {
          padding-top: 4rem;
        }
      }

      /* Dark mode support for critical styles */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: hsl(220 25% 8%);
          color: hsl(0 0% 95%);
        }

        .app-shell {
          background-color: hsl(220 25% 8%);
        }

        .app-shell-sidebar,
        .app-shell-header {
          background-color: hsl(220 20% 10%);
          border-color: hsl(220 15% 18%);
        }

        .skeleton {
          background-color: hsl(220 15% 12%);
        }

        .mobile-menu-button {
          background-color: hsl(220 20% 10%);
          border-color: hsl(220 15% 18%);
        }
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        .app-shell-sidebar {
          transition: none;
        }

        .animate-pulse {
          animation: none;
        }
      }
    </style>

    <title>Setupati School Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Translate Integration -->
    <div id="google_translate_element" style="display: none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'ta,en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
          },
          'google_translate_element'
        );
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Offline Detection -->
    <script>
      // Basic offline detection
      window.addEventListener('online', () => {
        console.log('App is online');
        document.body.classList.remove('offline');
      });

      window.addEventListener('offline', () => {
        console.log('App is offline');
        document.body.classList.add('offline');
      });
    </script>
  </body>
</html>
